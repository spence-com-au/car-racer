<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1142 220" width="1142" height="220">
  <title>Car Racer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16264A"/>
      <stop offset="1" stop-color="#0B1428"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g transform="translate(0 0) scale(0.4296875)"><g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- sun / spotlight -->
    <circle cx="300" cy="230" r="170" fill="#57B5E8" opacity=".10"/>
    <!-- road -->
    <path d="M-20 400 Q256 330 540 372 V540 H-20 Z" fill="#2C3550"/>
    <path d="M-20 400 Q256 330 540 372" fill="none" stroke="#fff" stroke-width="10" opacity=".85"/>
    <path d="M10 456 Q256 400 520 432" fill="none" stroke="#F2BF1A" stroke-width="9" stroke-dasharray="34 26" opacity=".9"/>
    <!-- speed streaks: one per player colour -->
    <g transform="rotate(-6 256 256)">
      <path d="M54 210 H150" stroke="#F2BF1A" stroke-width="13" stroke-linecap="round"/>
      <path d="M20 236 H150" stroke="#0073B3" stroke-width="13" stroke-linecap="round"/>
      <path d="M66 262 H150" stroke="#D65E00" stroke-width="13" stroke-linecap="round"/>
      <path d="M32 288 H150" stroke="#009E73" stroke-width="13" stroke-linecap="round"/>
      <path d="M78 314 H150" stroke="#CC78A6" stroke-width="13" stroke-linecap="round"/>
      <path d="M46 340 H150" stroke="#57B5E8" stroke-width="13" stroke-linecap="round"/>
    </g>
    <!-- kart -->
    <g transform="translate(286 372) rotate(-6) scale(.92)">
    <g>
      <!-- shadow -->
      <ellipse cx="0" cy="4" rx="170" ry="14" fill="#000" opacity=".28"/>
      <!-- rear wing -->
      <path d="M-150 -118 h70 l-6 22 h-70 z" fill="#F2BF1A" stroke="#1A1A20" stroke-width="9" stroke-linejoin="round"/>
      <path d="M-112 -98 l8 40" stroke="#1A1A20" stroke-width="12" stroke-linecap="round"/>
      <!-- body -->
      <path d="M-158 -40 Q-160 -70 -128 -74 L-58 -78 Q-40 -116 6 -118 L40 -118 Q66 -116 80 -86
               L150 -66 Q182 -58 178 -34 L174 -18 Q170 -6 156 -6 L-140 -6 Q-158 -6 -158 -24 Z"
            fill="#F2BF1A" stroke="#1A1A20" stroke-width="10" stroke-linejoin="round"/>
      <!-- racing stripe and number disc -->
      <path d="M-150 -44 L170 -40" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9"/>
      <circle cx="-10" cy="-44" r="21" fill="#fff" stroke="#1A1A20" stroke-width="7"/>
      <path d="M-15 -55 l7 -4 v32" fill="none" stroke="#1A1A20" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- helmet -->
      <circle cx="18" cy="-140" r="36" fill="#D65E00" stroke="#1A1A20" stroke-width="10"/>
      <path d="M26 -152 h26 q8 0 8 10 v6 q0 10 -10 10 h-24 z" fill="#57B5E8" stroke="#1A1A20" stroke-width="7" stroke-linejoin="round"/>
      <path d="M-14 -148 q14 -22 40 -24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".7"/>
      <!-- wheels -->
      <g stroke="#1A1A20" stroke-width="10">
        <circle cx="-100" cy="-28" r="48" fill="#2A2A33"/>
        <circle cx="-100" cy="-28" r="20" fill="#D9DDE3"/>
        <circle cx="122" cy="-24" r="42" fill="#2A2A33"/>
        <circle cx="122" cy="-24" r="17" fill="#D9DDE3"/>
      </g>
    </g></g>
    <!-- chequered flag corner -->
    <g transform="translate(372 64) rotate(12)">
      <path d="M0 0 V130" stroke="#D9DDE3" stroke-width="8" stroke-linecap="round"/>
      <g transform="translate(4 4)"><rect x="0" y="0" width="84" height="56" fill="#fff"/><g fill="#1A1A20"><rect x="0" y="0" width="14" height="14"/><rect x="28" y="0" width="14" height="14"/><rect x="56" y="0" width="14" height="14"/><rect x="14" y="14" width="14" height="14"/><rect x="42" y="14" width="14" height="14"/><rect x="70" y="14" width="14" height="14"/><rect x="0" y="28" width="14" height="14"/><rect x="28" y="28" width="14" height="14"/><rect x="56" y="28" width="14" height="14"/><rect x="14" y="42" width="14" height="14"/><rect x="42" y="42" width="14" height="14"/><rect x="70" y="42" width="14" height="14"/></g></g>
    </g></g></g>
