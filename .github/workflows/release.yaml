---
name: 'Release'

# Pushing a tag like `v0.1.0` builds a release-signed APK and the Linux server (a tarball and a Docker image on GHCR,
# `docs/server.md`) and publishes them to GitHub Releases. Releases are immutable, so the assets go up to a draft that
# is published last. Running the workflow by hand on `master` with a version does the same, tagging `master` first.
# Needs the Unity licence secrets and the Android keystore secrets (see `docs/ci-setup.md`).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like v0.13.0 (tags master)'
        required: true
        type: 'string'

permissions:
  contents: 'write'
  packages: 'write'

env:
  TAG: '${{ inputs.version || github.ref_name }}'

jobs:
  android:
    name: 'Signed Android APK'
    needs: 'check'
    runs-on: 'ubuntu-latest'

    # A healthy build takes 15-20 minutes; a hung Unity editor would otherwise sit for 6 hours.
    timeout-minutes: 60

    steps:
      - uses: 'actions/checkout@v4.4.0'
        with:
          ref: 'refs/tags/${{ env.TAG }}'
          fetch-depth: 0

      - uses: 'jlumbroso/free-disk-space@v1.3.1'
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: 'actions/cache@v4.3.0'
        with:
          path: 'Unity/Library'
          key: "Library-android-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}"
          restore-keys: 'Library-android-'

      # The tag without its `v`. GameCI's `Tag` versioning reads every tag on the commit, so a second tag (one left by a
      # release published by hand) would make an unparseable version and an APK with version code 1.
      - name: 'Version'
        id: 'version'
        run: 'echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"'

      - uses: 'game-ci/unity-builder@v4.8.2'
        env:
          UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
          UNITY_LICENSE: '${{ secrets.UNITY_LICENSE }}'
          UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
        with:
          projectPath: 'Unity'
          targetPlatform: 'Android'
          buildName: 'CarRacer'
          buildMethod: 'CarRacer.Editor.BuildScript.BuildFromCommandLine'
          androidExportType: 'androidPackage'
          versioning: 'Custom'
          version: '${{ steps.version.outputs.version }}'
          androidKeystoreName: 'release.keystore'
          androidKeystoreBase64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
          androidKeystorePass: '${{ secrets.ANDROID_KEYSTORE_PASS }}'
          androidKeyaliasName: '${{ secrets.ANDROID_KEYALIAS_NAME }}'
          androidKeyaliasPass: '${{ secrets.ANDROID_KEYALIAS_PASS }}'

      # Unversioned, so `releases/latest/download/CarRacer.apk` always points at the newest build. A draft: the
      # repository's releases are immutable, so nothing can be attached once it is published. The `publish` job
      # publishes it after every asset is up.
      - uses: 'softprops/action-gh-release@v2.6.2'
        with:
          tag_name: '${{ env.TAG }}'
          files: 'build/Android/CarRacer.apk'
          generate_release_notes: true
          draft: true

  # A release made on the Releases page is already published (and so immutable) when its tag fires this workflow, and
  # the assets could never be attached. Fail before the long build.
  check:
    name: 'No published release for the tag'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Check'
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          draft=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "${draft}" = false ]; then
            echo "::error::Release ${TAG} is already published and immutable, so its assets can't be uploaded. Cut releases by pushing a tag or running this workflow (docs/ci-setup.md), and use a new version."
            exit 1
          fi

      # A manual run tags the commit it ran on. Pushes made with the workflow's token start no workflows, so this run
      # does the release itself. An existing tag (a re-run) is kept.
      - name: 'Tag master'
        if: "github.event_name == 'workflow_dispatch'"
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '${TAG}' should look like v0.13.0."
            exit 1
          fi
          if [ "${GITHUB_REF}" != refs/heads/master ]; then
            echo "::error::Run the release on master, not ${GITHUB_REF}."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists; releasing it."
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}"
          fi

  linux-server:
    name: 'Linux Server Tarball and Docker Image'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 60

    # After the APK job, which creates the release, so the two don't race to create it.
    needs: 'android'

    steps:
      - uses: 'actions/checkout@v4.4.0'
        with:
          ref: 'refs/tags/${{ env.TAG }}'
          fetch-depth: 0

      - uses: 'actions/cache@v4.3.0'
        with:
          path: 'Unity/Library'
          key: "Library-linux-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}"
          restore-keys: 'Library-linux-'

      # The tag without its `v`. GameCI's `Tag` versioning reads every tag on the commit, so a second tag (one left by a
      # release published by hand) would make an unparseable version.
      - name: 'Version'
        id: 'version'
        run: 'echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"'

      - uses: 'game-ci/unity-builder@v4.8.2'
        env:
          UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
          UNITY_LICENSE: '${{ secrets.UNITY_LICENSE }}'
          UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
        with:
          projectPath: 'Unity'
          targetPlatform: 'StandaloneLinux64'
          buildName: 'CarRacer'
          buildMethod: 'CarRacer.Editor.BuildScript.BuildLinuxServerFromCommandLine'
          versioning: 'Custom'
          version: '${{ steps.version.outputs.version }}'

      - name: 'Package the server'
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          cp server/run-server.sh server/Dockerfile build/StandaloneLinux64/
          tar -czf "CarRacer-server-${TAG}-linux-x86_64.tar.gz" --transform "s,^build/StandaloneLinux64,car-racer-server," build/StandaloneLinux64

      - uses: 'softprops/action-gh-release@v2.6.2'
        with:
          tag_name: '${{ env.TAG }}'
          files: 'CarRacer-server-${{ env.TAG }}-linux-x86_64.tar.gz'
          draft: true

      - uses: 'docker/login-action@v3.7.0'
        with:
          registry: 'ghcr.io'
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'

      - name: 'Image name'
        id: 'image'
        run: 'echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"'

      - uses: 'docker/build-push-action@v6.19.2'
        with:
          context: 'build/StandaloneLinux64'
          file: 'build/StandaloneLinux64/Dockerfile'
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.TAG }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Car Racer LAN host with no player of its own

  publish:
    name: 'Publish the release'
    needs: ['android', 'linux-server']
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Publish'
        env:
          GH_TOKEN: '${{ github.token }}'
        run: 'gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest'
