---
name: 'Build'

on:
  pull_request: {}
  push:
    branches: ['master']
  workflow_dispatch: {}

permissions:
  checks: 'write'
  contents: 'read'

concurrency:
  group: 'build-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  android:
    name: 'Android Development APK'
    needs: 'licence'
    if: "needs.licence.outputs.available == 'true'"
    runs-on: 'ubuntu-latest'

    # A healthy build takes 15-20 minutes; a hung Unity editor would otherwise sit for 6 hours.
    timeout-minutes: 60

    steps:
      - uses: 'actions/checkout@v4.4.0'
        with:
          fetch-depth: 0
          lfs: true

      # The Unity Android image is large; make room on the runner.
      - uses: 'jlumbroso/free-disk-space@v1.3.1'
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: 'actions/cache@v4.3.0'
        with:
          path: 'Unity/Library'
          key: "Library-android-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}"
          restore-keys: 'Library-android-'

      - uses: 'game-ci/unity-builder@v4.8.2'
        env:
          UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
          UNITY_LICENSE: '${{ secrets.UNITY_LICENSE }}'
          UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
        with:
          projectPath: 'Unity'
          targetPlatform: 'Android'
          buildName: 'CarRacer'
          buildMethod: 'CarRacer.Editor.BuildScript.BuildFromCommandLine'
          customParameters: '-carRacerDevelopment'
          androidExportType: 'androidPackage'
          versioning: 'Semantic'

      - uses: 'actions/upload-artifact@v4.6.2'
        with:
          name: 'CarRacer-dev-apk'
          path: 'build/Android/*.apk'
          if-no-files-found: 'error'

  licence:
    name: 'Check Unity Licence'
    runs-on: 'ubuntu-latest'
    outputs:
      available: '${{ steps.check.outputs.available }}'
    steps:
      - id: 'check'
        env:
          UNITY_LICENSE: '${{ secrets.UNITY_LICENSE }}'
        run: |
          if [ -n "${UNITY_LICENSE}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::UNITY_LICENSE is not set, so Unity tests and builds are skipped. See docs/ci-setup.md."
          fi

  server:
    name: 'Server Build'
    needs: 'licence'
    if: "needs.licence.outputs.available == 'true'"
    runs-on: 'ubuntu-latest'

    # A healthy build takes 15-20 minutes; a hung Unity editor would otherwise sit for 6 hours.
    timeout-minutes: 60

    steps:
      - uses: 'actions/checkout@v4.4.0'
        with:
          fetch-depth: 0
          lfs: true

      - uses: 'actions/cache@v4.3.0'
        with:
          path: 'Unity/Library'
          key: "Library-linux-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}"
          restore-keys: 'Library-linux-'

      - uses: 'game-ci/unity-builder@v4.8.2'
        env:
          UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
          UNITY_LICENSE: '${{ secrets.UNITY_LICENSE }}'
          UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
        with:
          projectPath: 'Unity'
          targetPlatform: 'StandaloneLinux64'
          buildName: 'CarRacer'
          buildMethod: 'CarRacer.Editor.BuildScript.BuildLinuxServerFromCommandLine'
          versioning: 'Semantic'

      # Start the host for a few seconds: it should begin hosting, say so and still be running when `timeout` stops it,
      # which exits 124 (design doc §2.3). A crash or a stop after the start line exits with anything else.
      - name: 'Smoke-test the server'
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          cp server/run-server.sh build/StandaloneLinux64/
          ls -la build/StandaloneLinux64
          status=0
          timeout 30 build/StandaloneLinux64/run-server.sh -port 47901 -name "CI" > server.log 2>&1 || status=$?
          tail -n 40 server.log
          grep -q 'Car Racer server "CI" on port 47901' server.log
          if [ "${status}" -ne 124 ]; then
            echo "::error::The server exited with status ${status} before the smoke test stopped it."
            exit 1
          fi

      - uses: 'actions/upload-artifact@v4.6.2'
        with:
          name: 'CarRacer-linux-server'
          path: 'build/StandaloneLinux64'
          if-no-files-found: 'error'

  test:
    name: 'Unity Tests'
    needs: 'licence'
    if: "needs.licence.outputs.available == 'true'"
    runs-on: 'ubuntu-latest'

    # A healthy build takes 15-20 minutes; a hung Unity editor would otherwise sit for 6 hours.
    timeout-minutes: 60

    steps:
      - uses: 'actions/checkout@v4.4.0'
        with:
          lfs: true

      # The Unity Android image is large; make room on the runner.
      - uses: 'jlumbroso/free-disk-space@v1.3.1'
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: 'actions/cache@v4.3.0'
        with:
          path: 'Unity/Library'
          key: "Library-test-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}"
          restore-keys: 'Library-test-'

      # Tests of the Android player settings (`#if UNITY_ANDROID`) compile only with the Android target active, which
      # needs the Android editor image; the test runner's default image and target are standalone Linux.
      - id: 'image'
        run: |
          version="$(sed -n 's/^m_EditorVersion: //p' Unity/ProjectSettings/ProjectVersion.txt)"
          echo "name=unityci/editor:ubuntu-${version}-android-3" >> "${GITHUB_OUTPUT}"

      - uses: 'game-ci/unity-test-runner@v4.4.0'
        id: 'tests'
        env:
          UNITY_EMAIL: '${{ secrets.UNITY_EMAIL }}'
          UNITY_LICENSE: '${{ secrets.UNITY_LICENSE }}'
          UNITY_PASSWORD: '${{ secrets.UNITY_PASSWORD }}'
        with:
          projectPath: 'Unity'
          customImage: '${{ steps.image.outputs.name }}'
          customParameters: '-buildTarget Android'
          githubToken: '${{ secrets.GITHUB_TOKEN }}'
          checkName: 'Unity test results'

          # `latest` asks the GitHub API for the newest game-ci CLI on every run, and a 403 from that lookup fails the
          # job before any test runs. A fixed version comes from the cache.
          cliVersion: 'v0.1.72'

      - uses: 'actions/upload-artifact@v4.6.2'
        if: 'always()'
        with:
          name: 'unity-test-results'
          path: '${{ steps.tests.outputs.artifactsPath }}'
